version: 1
applications:
  - appRoot: faction-bbs
    backend:
      phases:
        preBuild:
          commands:
            # vite 8 / vitest 5 は Node 22 を想定
            - nvm install 22 && nvm use 22
        build:
          commands:
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm test
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
